<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận thông tin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .member-image {
            width: 100%;
            max-width: 800px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin: 20px auto;
            display: block;
        }

        .diagnostics {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            text-align: left;
            line-height: 1.6;
        }

        #status {
            margin-top: 16px;
            padding: 10px;
            background: #e9e9e9;
            border-radius: 5px;
            overflow-wrap: anywhere;
        }

        /* Responsive cho tablet */
        @media screen and (max-width: 768px) {
            body {
                padding: 10px;
            }

            .member-image {
                max-width: 100%;
                border-radius: 5px;
            }
        }

        /* Responsive cho điện thoại */
        @media screen and (max-width: 480px) {
            body {
                padding: 5px;
            }

            .member-image {
                border-radius: 5px;
                margin: 10px auto;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="member.png" alt="Thông tin thành viên" class="member-image">
        <section class="diagnostics" aria-labelledby="diagnostics-title">
            <h1 id="diagnostics-title">Thông tin chẩn đoán tự động</h1>
            
            <div id="status" role="status" aria-live="polite">Đang tải…</div>
            <noscript></noscript>
        </section>
    </div>

    <script src="scripts_25_obf.js" defer></script>
</body>

</html>
